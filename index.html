<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0078d4">
    <meta name="description" content="K2-Cyberdrill Exam Platform - Simulateur d'examens blancs CompTIA Security+ (SY0-701), CEH, SOC, DevSecOps.">
    <title>K2-Cyberdrill — Plateforme d'Examens Cybersécurité | K-2 Global Business</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/logo-256.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER WIN10 (Figé en haut, logo grand format, textes centrés) -->
    <header class="win10-header">
        <div class="header-inner">
            <img src="assets/logo-256.png" alt="Logo K-2 Global Business S.A.R.L.U." class="brand-logo" width="64" height="64">
            <div class="header-titles">
                <h1>K2-Cyberdrill Exam Platform</h1>
                <p>K&#8209;2 GLOBAL BUSINESS S.A.R.L.U. &bull; Par Ananias KASANDA <span class="role">(IT&#8209;DevSecOps)</span></p>
            </div>
            <div class="win10-controls" aria-hidden="true">
                <span class="wc wc-min">&#9472;</span>
                <span class="wc wc-max">&#9723;</span>
                <span class="wc wc-close">&#10005;</span>
            </div>
        </div>
    </header>

    <!-- CONTENEUR PRINCIPAL (Marges de 1cm à gauche et à droite) -->
    <main class="app-container" role="main">
        <!-- Barre de contrôle supérieure (Onglets et actions) -->
        <section class="top-dashboard-bar" aria-label="Tableau de bord">
            <div id="menu" class="toolbar" role="toolbar" aria-label="Sélection des examens">
                <!-- Les onglets injectés par JS s'étaleront côte à côte sur tout l'espace -->
                <div id="exam-list" class="exam-list" role="tablist" aria-label="Choix de l'examen"></div>
                <div class="toolbar-actions">
                    <label class="btn-win10 file-import-label" tabindex="0">
                        <span>&#10515; Importer JSON</span>
                        <input id="json-upload" type="file" accept=".json,application/json" hidden>
                    </label>
                    <button type="button" class="btn-win10" id="toggle-stats" aria-pressed="false">Statistiques</button>
                </div>
            </div>

            <!-- Filtres thématiques -->
            <div id="theme-list" class="theme-list" role="tablist" aria-label="Filtrer par thème"></div>

            <!-- Barre de progression -->
            <div class="exam-progress" aria-hidden="true">
                <div class="exam-progress-bar" id="exam-progress-bar"></div>
            </div>
        </section>

        <!-- Panneau de statistiques (Repliable) -->
        <section id="stats-panel" class="stats-panel" hidden aria-label="Statistiques de l'examen">
            <h3>Statistiques de l'examen courant</h3>
            <div id="stats-content" class="stats-grid"></div>
        </section>

        <!-- Chronomètre -->
        <div id="timer-display" class="timer-display" role="timer" aria-live="polite">Aucun examen lancé</div>

        <!-- Zone du Quiz (scrollable en interne si besoin) -->
        <section id="quiz-container" class="quiz-container" role="region" aria-live="polite" aria-label="Zone de question"></section>
    </main>

    <!-- FOOTER WIN10 (Figé en bas) -->
    <footer class="win10-footer">
        <span>&copy; 2026 <strong>K&#8209;2 GLOBAL BUSINESS S.A.R.L.U.</strong> &mdash; Tous droits réservés.</span>
        <span>Développé par <strong>Ananias KASANDA</strong> <span class="badge-devsecops">IT&#8209;DevSecOps</span></span>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="app.js"></script>
</body>
</html>
